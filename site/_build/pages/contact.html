    <section class="page-hero page-hero-simple" aria-labelledby="page-title">
      <div class="container">
        <p class="hero-kicker">Free quote</p>
        <h1 id="page-title" class="sheen">Tell us what needs cleaning.</h1>
        <p class="hero-lede">Fill out the form and we’ll get back to you with a price. Prefer to talk? Call or text anytime.</p>
      </div>
    </section>

    <section class="section quote" aria-label="Quote request">
      <div class="container quote-inner">
        <form class="quote-form" id="quote-form" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="q-name">Your name <span class="req" aria-hidden="true">*</span></label>
              <input id="q-name" name="name" type="text" autocomplete="name" required aria-describedby="q-name-err">
              <p class="field-error" id="q-name-err"></p>
            </div>
            <div class="field">
              <label for="q-business">Business name</label>
              <input id="q-business" name="business" type="text" autocomplete="organization">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="q-phone">Phone <span class="req" aria-hidden="true">*</span></label>
              <input id="q-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required aria-describedby="q-phone-err">
              <p class="field-error" id="q-phone-err"></p>
            </div>
            <div class="field">
              <label for="q-email">Email</label>
              <input id="q-email" name="email" type="email" autocomplete="email" aria-describedby="q-email-err">
              <p class="field-error" id="q-email-err"></p>
            </div>
          </div>
          <div class="field">
            <label for="q-city">City</label>
            <input id="q-city" name="city" type="text" autocomplete="address-level2">
          </div>
          <fieldset class="field services-pick">
            <legend>What do you need cleaned?</legend>
            <label class="check"><input type="checkbox" name="services" value="Kitchen hood and exhaust" data-key="hood"> <span>Kitchen hood and exhaust</span></label>
            <label class="check"><input type="checkbox" name="services" value="Parking lot pressure washing" data-key="lot"> <span>Parking lot</span></label>
            <label class="check"><input type="checkbox" name="services" value="Garbage cans and dumpster pad" data-key="cans"> <span>Garbage cans and dumpster pad</span></label>
          </fieldset>
          <div class="field">
            <label for="q-notes">Anything we should know?</label>
            <textarea id="q-notes" name="notes" rows="4" placeholder="Number of hoods, size of the lot, best time to reach you"></textarea>
          </div>
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn-primary btn-lg btn-submit" type="submit">
            <span class="btn-label">Request my quote</span>
          </button>
          <p class="form-status" role="status" data-form-status></p>
        </form>

        <aside class="contact-side" aria-label="Other ways to reach us">
          <div class="contact-card">
            <p class="cc-label">Call or text</p>
            <a class="phone-big" href="tel:{{tel}}">{{phone}}</a>
            <div class="cc-actions">
              <a class="btn btn-ghost" href="tel:{{tel}}">Call</a>
              <a class="btn btn-ghost" href="sms:{{tel}}">Text</a>
            </div>
          </div>
          <div class="contact-card">
            <p class="cc-label">Email</p>
            <a class="cc-email" href="mailto:{{email}}">{{email}}</a>
          </div>
          <div class="contact-card">
            <p class="cc-label">Service area</p>
            <p>All of North Texas. <a class="text-link" href="service-area.html">See the cities we serve</a></p>
          </div>
        </aside>
      </div>
    </section>
